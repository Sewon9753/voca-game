<script>
// 단어 암기 게임 엔진 — 순수 로직 (브라우저·node 공용)
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VocaEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const PHASES = ['en2ko', 'ko2en'];

  function fisherYates(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function allIdx(words) {
    return words.map((_, i) => i);
  }

  function createSession(words, opts) {
    opts = opts || {};
    const shuffle = opts.shuffle || fisherYates;
    return {
      words,
      shuffle,
      phase: PHASES[0],
      pass: 1,
      queue: shuffle(allIdx(words)),
      pos: 0,
      wrong: [],
      rounds: [{ phase: PHASES[0], pass: 1, ok: 0, ng: 0 }],
      misses: words.map(() => 0),
      startedAt: Date.now(),
      finishedAt: null,
    };
  }

  function current(s) {
    if (s.phase === 'done') return null;
    const w = s.words[s.queue[s.pos]];
    return {
      word: w,
      index: s.pos,
      total: s.queue.length,
      prompt: s.phase === 'en2ko' ? w.en : w.ko,
      answer: s.phase === 'en2ko' ? w.ko : w.en,
    };
  }

  function answer(s, ok) {
    if (s.phase === 'done') return { type: 'done' };
    const idx = s.queue[s.pos];
    const round = s.rounds[s.rounds.length - 1];
    if (ok) round.ok++;
    else {
      round.ng++;
      s.wrong.push(idx);
      s.misses[idx]++;
    }
    s.pos++;
    if (s.pos < s.queue.length) return { type: 'next' };

    if (s.wrong.length > 0) {
      s.pass++;
      s.queue = s.shuffle(s.wrong);
      s.wrong = [];
      s.pos = 0;
      s.rounds.push({ phase: s.phase, pass: s.pass, ok: 0, ng: 0 });
      return { type: 'retry', count: s.queue.length };
    }

    const next = PHASES[PHASES.indexOf(s.phase) + 1];
    if (!next) {
      s.phase = 'done';
      s.finishedAt = Date.now();
      return { type: 'done' };
    }
    s.phase = next;
    s.pass = 1;
    s.queue = s.shuffle(allIdx(s.words));
    s.wrong = [];
    s.pos = 0;
    s.rounds.push({ phase: next, pass: 1, ok: 0, ng: 0 });
    return { type: 'phase', phase: next };
  }

  function summary(s) {
    const weak = s.words
      .map((w, i) => ({ en: w.en, ko: w.ko, misses: s.misses[i] }))
      .filter((w) => w.misses > 0)
      .sort((a, b) => b.misses - a.misses);
    return {
      rounds: s.rounds.map((r) => ({ ...r })),
      weak,
      elapsedMs: (s.finishedAt || Date.now()) - s.startedAt,
    };
  }

  // 붙여넣기 텍스트 → 단어 목록. 구분자: 탭 · " - " · " : " · 2칸 이상 공백
  function parsePack(text) {
    const out = [];
    text.split(/\r?\n/).forEach((line) => {
      const t = line.trim().replace(/^\d+[.)]?\s+/, '');
      if (!t) return;
      const m = t.match(/^(.+?)(?:\t+|\s+-\s+|\s+:\s+|\s{2,})(.+)$/);
      if (!m) return;
      out.push({ n: out.length + 1, en: m[1].trim(), ko: m[2].trim() });
    });
    return out;
  }

  // ---- 발음 연습 보조
  function norm(t) { return String(t || '').toLowerCase().replace(/[^a-z' ]+/g, ' ').trim().split(/\s+/).filter(Boolean); }
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function sim(a, b) { const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; }
  // 목표 단어(구) vs 음성인식 결과 → 0..1. 단어 하나면 철자 유사도, 구면 단어별 적중 비율(유사도 0.8 이상=적중)
  function pronunciationScore(target, heard) {
    const t = norm(target), h = norm(heard);
    if (!t.length) return 0;
    if (!h.length) return 0;
    const best = (w) => Math.max(...h.map((x) => sim(w, x)));
    if (t.length === 1) return best(t[0]);
    return t.filter((w) => best(w) >= 0.8).length / t.length;
  }
  // "be FA-mous for" → [{text, stressed}]  (대문자 음절 = 강세)
  function stressSyllables(pattern) {
    return String(pattern || '').split(/[\s-]+/).filter(Boolean).map((tok) => ({
      text: tok.toLowerCase(),
      stressed: /[A-Z]/.test(tok) && tok === tok.toUpperCase(),
    }));
  }

  // 결과 공유용 텍스트 (카톡 복붙용 · 이모지 없음)
  function formatResult(sm, meta) {
    const s = Math.round(sm.elapsedMs / 1000);
    const time = `${Math.floor(s / 60)}분 ${s % 60}초`;
    const phaseLine = (ph, label) => {
      const rs = sm.rounds.filter((r) => r.phase === ph);
      if (!rs.length) return null;
      return `${label}: ` + rs.map((r) => `${r.pass}회차 ${r.ok}/${r.ok + r.ng}`).join(', ');
    };
    const weak = sm.weak.length ? sm.weak.map((w) => `${w.en}(${w.misses})`).join(', ') : '없음 (전부 한 번에 통과)';
    return [
      `[${meta.name ? meta.name + ' ' : ''}단어 게임 결과] ${meta.date}`,
      `${meta.title} (${meta.total}단어) · ${time}`,
      phaseLine('en2ko', '1차 영어→뜻'),
      phaseLine('ko2en', '2차 뜻→영어'),
      `틀린 단어: ${weak}`,
    ].filter(Boolean).join('\n');
  }

  // 완료 횟수 원장 — { [팩키]: { test: n, study: n, last: 'YYYY-MM-DD' } } (입력 불변)
  function bumpDone(done, key, kind, date) {
    const d = Object.assign({}, done || {});
    const cur = Object.assign({ test: 0, study: 0, last: '' }, d[key]);
    cur[kind] = (cur[kind] || 0) + 1;
    cur.last = date;
    d[key] = cur;
    return d;
  }
  // 예전 세션 기록(제목만 있음)으로 테스트 완료 횟수 1회 백필
  function doneFromSessions(sessions, titleToKey) {
    let d = {};
    (sessions || []).forEach((s) => { const k = titleToKey[s.title]; if (k) d = bumpDone(d, k, 'test', s.date || ''); });
    return d;
  }
  function doneLabel(rec) {
    if (!rec || (!rec.test && !rec.study)) return '';
    const parts = [];
    if (rec.test) parts.push(`✅ 테스트 ${rec.test}회`);
    if (rec.study) parts.push(`🃏 카드 ${rec.study}회`);
    if (rec.last) { const [, m, dd] = rec.last.split('-'); parts.push(`최근 ${+m}/${+dd}`); }
    return parts.join(' · ');
  }

  return { createSession, current, answer, summary, parsePack, fisherYates, pronunciationScore, stressSyllables, formatResult, bumpDone, doneFromSessions, doneLabel };
});

</script>

<script>
(function () {
  const E = window.VocaEngine;

  // ---- 화면 폭에 맞춘 글자 크기 (터치 기기: 폭/23, 17~40px · 마우스 기기: 17px)
  function applyScale(coarse, width) {
    const px = coarse ? Math.max(17, Math.min(40, width / 23)) : 17;
    document.documentElement.style.fontSize = px + 'px';
    return px;
  }
  window.__applyScale = applyScale;
  const coarse = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  applyScale(coarse(), window.innerWidth);
  window.addEventListener('resize', () => applyScale(coarse(), window.innerWidth));
  const $ = (id) => document.getElementById(id);
  const LS = { packs: 'voca:packs', sessions: 'voca:sessions', secs: 'voca:secs', name: 'voca:name', done: 'voca:done' };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let secs = load(LS.secs, 5);
  let packs = [...window.VOCA_PACKS, ...load(LS.packs, [])];
  let session = null, pack = null, timer = null, revealed = false, shownAt = 0;
  // 완료 횟수: 팩키=pack_id(없으면 제목). 첫 실행 시 예전 세션 기록에서 테스트 횟수 백필
  const packKey = (p) => p.pack_id || p.title;
  const today = () => { const d = new Date(), z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
  let done = load(LS.done, null);
  if (!done) { done = E.doneFromSessions(load(LS.sessions, []), Object.fromEntries(packs.map(p => [p.title, packKey(p)]))); save(LS.done, done); }
  const markDone = (p, kind) => { done = E.bumpDone(done, packKey(p), kind, today()); save(LS.done, done); };

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ---- 홈
  function renderHome() {
    document.querySelectorAll('#secs button').forEach(b => b.classList.toggle('sel', +b.dataset.s === secs));
    $('packs').innerHTML = packs.map((p, i) =>
      `<div class="item"><div><b>${p.title}</b><div class="sub">${p.words.length}단어${E.doneLabel(done[packKey(p)]) ? ` · <span class="done">${E.doneLabel(done[packKey(p)])}</span>` : ''}</div></div><div class="acts"><button class="study" data-i="${i}">🃏 카드</button><button class="test" data-i="${i}">⚡ 테스트</button></div></div>`).join('');
    const ss = load(LS.sessions, []);
    $('recentWrap').style.display = ss.length ? '' : 'none';
    $('recent').innerHTML = ss.slice(-10).reverse().map(s =>
      `<div>${s.date} · ${s.title} · ${fmt(s.elapsedMs)} · 틀림 ${s.totalNg}회</div>`).join('');
  }
  $('userName').value = load(LS.name, '');
  $('userName').addEventListener('input', () => save(LS.name, $('userName').value.trim()));
  $('secs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; secs = +b.dataset.s; save(LS.secs, secs); renderHome(); });
  $('packs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('test')) start(packs[+b.dataset.i]); else startStudy(packs[+b.dataset.i]);
  });
  $('addPack').addEventListener('click', () => {
    const words = E.parsePack($('newText').value);
    if (words.length < 2) { $('addMsg').textContent = '2단어 이상 필요해요'; return; }
    const p = { pack_id: 'custom-' + Date.now(), title: $('newTitle').value.trim() || `내 단어팩 (${words.length})`, words };
    const custom = load(LS.packs, []); custom.push(p); save(LS.packs, custom);
    packs = [...window.VOCA_PACKS, ...custom];
    $('newText').value = ''; $('newTitle').value = ''; $('addMsg').textContent = `추가됨: ${p.title}`;
    renderHome();
  });

  // ---- 게임
  function start(p) {
    pack = p; session = E.createSession(p.words);
    show('card'); showCard();
  }
  function phaseName(ph) { return ph === 'en2ko' ? '1차 영어 → 뜻' : '2차 뜻 → 영어'; }

  function showCard() {
    const c = E.current(session);
    if (!c) return finish();
    revealed = false;
    $('phaseLabel').textContent = `${phaseName(session.phase)} · ${session.pass}회차`;
    $('posLabel').textContent = `${c.index + 1} / ${c.total}`;
    $('prog').style.width = (c.index / c.total * 100) + '%';
    $('prompt').textContent = c.prompt;
    $('prompt').className = 'prompt' + (session.phase === 'ko2en' ? ' ko' : '');
    $('answer').textContent = '';
    $('answer').className = 'answer' + (session.phase === 'ko2en' ? ' en' : '');
    $('ring').style.display = '';
    $('hint').style.display = '';
    $('judge').classList.remove('on');
    startCountdown();
  }

  const CIRC = 2 * Math.PI * 52;
  function startCountdown() {
    clearInterval(timer);
    const t0 = performance.now(), total = secs * 1000;
    $('ringFg').style.strokeDasharray = CIRC; $('ringFg').style.strokeDashoffset = 0;
    $('num').textContent = secs;
    timer = setInterval(() => {
      const el = performance.now() - t0, left = Math.max(0, total - el);
      $('num').textContent = Math.ceil(left / 1000);
      $('ringFg').style.strokeDashoffset = CIRC * (el / total);
      if (left <= 0) reveal();
    }, 50);
  }

  function reveal() {
    if (revealed) return;
    revealed = true; clearInterval(timer);
    const c = E.current(session);
    $('answer').textContent = c.answer;
    $('ring').style.display = 'none';
    $('hint').style.display = 'none';
    $('judge').classList.add('on');
    shownAt = Date.now();
  }

  function judge(ok) {
    if (!revealed) return;
    const ev = E.answer(session, ok);
    if (ev.type === 'retry') toast(`틀린 ${ev.count}개 다시!`, `${session.pass}회차`, showCard);
    else if (ev.type === 'phase') toast('1차 완료 🎯', '이제 뜻을 보고 영어를 떠올려요', showCard);
    else if (ev.type === 'done') finish();

  }

  function toast(main, sub, next) {
    $('toast').innerHTML = `<div>${main}<small>${sub}</small></div>`;
    $('toast').classList.add('on');
    setTimeout(() => { $('toast').classList.remove('on'); next(); }, 900);
  }

  $('stage').addEventListener('click', reveal);
  $('btnX').addEventListener('click', () => judge(false));
  $('btnO').addEventListener('click', () => judge(true));
  document.addEventListener('keydown', e => {
    if (!document.getElementById('card').classList.contains('on')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealed ? judge(true) : reveal(); }
    else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'o') judge(true);
    else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'x') judge(false);
  });

  // ---- 발음(TTS)
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    return vs.find(v => /Samantha|Google US|Ava|Allison/i.test(v.name)) || vs[0] || null;
  }
  function speak(text, rate) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.85; const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  // ---- 카드 학습
  let sPack = null, sIdx = 0;
  function startStudy(p) { sPack = p; sIdx = 0; show('study'); renderStudy(true); }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function stressHtml(pattern) {
    return String(pattern || '').split(/\s+/).filter(Boolean).map(word =>
      E.stressSyllables(word).map(x => x.stressed ? `<b>${esc(x.text.toUpperCase())}</b>` : esc(x.text)).join('·')
    ).join(' &nbsp;');
  }
  function highlight(sentence, word) {
    const head = word.split(' ').map(x => x.replace(/[^a-z]/gi, '')).sort((a, b) => b.length - a.length)[0];
    if (!head) return esc(sentence);
    return esc(sentence).replace(new RegExp(`\\b(${head}\\w*)`, 'i'), '<mark>$1</mark>');
  }
  function renderStudy(autoSpeak) {
    const w = sPack.words[sIdx];
    stopRec();
    $('studyPos').textContent = `${sIdx + 1} / ${sPack.words.length}`;
    $('scard').innerHTML = `
      <div class="sword"><span>${esc(w.en)}</span><button class="spk" data-say="${esc(w.en)}">🔊</button></div>
      <div><span class="ipa">${esc(w.ipa || '')}</span> &nbsp; <span class="stress">${stressHtml(w.stress)}</span></div>
      ${w.emoji ? `<div class="semoji">${esc(w.emoji)}</div>` : ''}
      <div class="smean">${esc(w.ko)}</div>
      ${w.ex ? `<div class="sec"><div class="lab">예문</div><div class="sex"><div class="en">${highlight(w.ex, w.en)}</div><button class="spk sm" data-say="${esc(w.ex)}">🔊</button></div><div class="sexko">${esc(w.ex_ko || '')}</div></div>` : ''}
      ${w.mnemonic ? `<div class="sec"><div class="lab">💡 이렇게 외워요</div><div class="smn">${esc(w.mnemonic)}</div></div>` : ''}
      <div class="sec pron">
        <div class="lab">🎤 발음 연습 — 강세: <span class="stress">${stressHtml(w.stress)}</span></div>
        <button class="rec" id="recBtn">🎤 녹음하고 따라 말하기</button>
        <div class="heard" id="heard"></div>
        <canvas class="env" id="env" width="600" height="120" style="display:none"></canvas>
        <div class="row" id="recActs" style="display:none"><button class="btn ghost" id="playMine">▶ 내 녹음</button><button class="btn ghost" data-say="${esc(w.en)}">🔊 원어</button></div>
      </div>`;
    $('sPrev').disabled = sIdx === 0;
    $('sNext').textContent = sIdx === sPack.words.length - 1 ? '끝 ✓' : '다음 ›';
    $('sbody').scrollTop = 0;
    if (autoSpeak) speak(w.en);
  }
  $('scard').addEventListener('click', e => {
    const b = e.target.closest('[data-say]'); if (b) { speak(b.dataset.say, b.classList.contains('sm') ? 0.9 : 0.8); return; }
    if (e.target.closest('#recBtn')) toggleRec();
    if (e.target.closest('#playMine') && mineUrl) new Audio(mineUrl).play();
  });
  $('sSpeak').addEventListener('click', () => speak(sPack.words[sIdx].en));
  $('sPrev').addEventListener('click', () => { if (sIdx > 0) { sIdx--; renderStudy(true); } });
  $('sNext').addEventListener('click', () => { if (sIdx < sPack.words.length - 1) { sIdx++; renderStudy(true); } else { stopRec(); markDone(sPack, 'study'); renderHome(); show('home'); } });
  $('studyHome').addEventListener('click', () => { stopRec(); speechSynthesis.cancel && speechSynthesis.cancel(); renderHome(); show('home'); });
  // 좌우 스와이프로 이전·다음. 세로 스크롤 중 비스듬한 손가락에 넘어가지 않도록 가로가 분명할 때만(가로 70px 이상 · 세로의 2배 이상 · 세로 60px 미만)
  let tx0 = 0, ty0 = 0;
  $('sbody').addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
  $('sbody').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 60 && Math.abs(dx) > Math.abs(dy) * 2) (dx < 0 ? $('sNext') : $('sPrev')).click();
  }, { passive: true });

  // ---- 발음 녹음·인식·크기 곡선
  let recOn = false, mediaRec = null, stream = null, mineUrl = null, envTimer = null, envData = [], recog = null;
  async function toggleRec() { recOn ? stopRec() : startRec(); }
  async function startRec() {
    const w = sPack.words[sIdx];
    const heard = $('heard');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      heard.innerHTML = '마이크는 <b>https 주소</b>(또는 Safari 탭)에서만 쓸 수 있어요.'; return;
    }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) { heard.textContent = '마이크 권한이 필요해요 (' + err.name + ')'; return; }
    recOn = true; $('recBtn').textContent = '⏹ 멈추기'; $('recBtn').classList.add('on');
    heard.textContent = '듣고 있어요… 또박또박 말해 보세요';
    // 크기 곡선
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC(); const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize); envData = [];
    envTimer = setInterval(() => { an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) { const d = (v - 128) / 128; sum += d * d; } envData.push(Math.sqrt(sum / buf.length)); }, 40);
    // 녹음
    if (window.MediaRecorder) {
      const chunks = []; mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => chunks.push(e.data);
      mediaRec.onstop = () => { if (mineUrl) URL.revokeObjectURL(mineUrl); mineUrl = URL.createObjectURL(new Blob(chunks, { type: mediaRec.mimeType })); $('recActs').style.display = ''; };
      mediaRec.start();
    }
    // 음성 인식
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recog = new SR(); recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 3;
      recog.onresult = ev => {
        const alts = Array.from(ev.results[0]).map(a => a.transcript);
        const best = alts.map(a => [a, E.pronunciationScore(w.en, a)]).sort((a, b) => b[1] - a[1])[0];
        const pct = Math.round(best[1] * 100);
        const face = pct >= 90 ? '👍 아주 좋아요!' : pct >= 60 ? '🙂 비슷해요, 강세를 더 살려 보세요' : '🔁 다시 한 번! 🔊 원어를 듣고 따라 해요';
        heard.innerHTML = `들린 말: <b>${esc(best[0])}</b> · 일치 ${pct}% <div>${face}</div>`;
      };
      recog.onerror = ev => { heard.textContent = '인식 실패(' + ev.error + ') — 녹음은 저장됐어요. ▶ 내 녹음과 🔊 원어를 번갈아 들어 보세요'; };
      recog.onend = () => { if (recOn) stopRec(); };
      recog.start();
    } else {
      heard.textContent = '이 브라우저는 음성 인식이 없어요 — 녹음 후 ▶ 내 녹음과 🔊 원어를 비교해 보세요';
    }
    setTimeout(() => { if (recOn) stopRec(); }, 6000);
  }
  function stopRec() {
    if (!recOn) return;
    recOn = false; clearInterval(envTimer);
    try { recog && recog.stop(); } catch {}
    try { mediaRec && mediaRec.state !== 'inactive' && mediaRec.stop(); } catch {}
    stream && stream.getTracks().forEach(t => t.stop()); stream = null;
    const b = $('recBtn'); if (b) { b.textContent = '🎤 다시 녹음'; b.classList.remove('on'); }
    drawEnv();
  }
  function drawEnv() {
    const c = $('env'); if (!c || envData.length < 5) return;
    c.style.display = '';
    const ctx = c.getContext('2d'); const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    // 앞뒤 무음 제거
    const th = Math.max(...envData) * 0.12; let a = envData.findIndex(v => v > th); let z = envData.length - 1; while (z > a && envData[z] < th) z--;
    const d = envData.slice(Math.max(0, a - 2), z + 3); const mx = Math.max(...d) || 1;
    ctx.fillStyle = '#7c5cff';
    d.forEach((v, i) => { const x = i / d.length * W, h = v / mx * (H - 20); ctx.fillRect(x, H - 10 - h, Math.max(2, W / d.length - 1), h); });
    ctx.fillStyle = '#8b90a0'; ctx.font = '18px sans-serif'; ctx.fillText('소리 크기 — 높은 막대 = 세게 말한 부분. 강세 음절에서 높아야 해요', 8, 20);
  }

  // ---- 결과
  function fmt(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}분 ${s % 60}초`; }
  function finish() {
    clearInterval(timer);
    const sm = E.summary(session);
    $('elapsed').textContent = fmt(sm.elapsedMs);
    $('resultTitle').textContent = pack.title;
    $('roundsTbl').innerHTML = '<tr><th>단계</th><th>회차</th><th class="ok">O</th><th class="ng">X</th></tr>' +
      sm.rounds.map(r => `<tr><td>${phaseName(r.phase)}</td><td>${r.pass}</td><td class="ok">${r.ok}</td><td class="ng">${r.ng}</td></tr>`).join('');
    $('weakWrap').innerHTML = sm.weak.length
      ? `<div class="sub">많이 틀린 단어</div><table>${sm.weak.slice(0, 5).map(w => `<tr><td><b>${w.en}</b></td><td>${w.ko}</td><td class="ng">${w.misses}회</td></tr>`).join('')}</table>`
      : '<div class="sub">한 번도 안 틀렸어요! 👏</div>';
    const ss = load(LS.sessions, []);
    ss.push({ date: new Date().toISOString().slice(0, 10), title: pack.title, elapsedMs: sm.elapsedMs,
      totalNg: sm.rounds.reduce((a, r) => a + r.ng, 0), weak: sm.weak.slice(0, 10) });
    save(LS.sessions, ss.slice(-50));
    markDone(pack, 'test');
    const d = new Date(), pad = (n) => String(n).padStart(2, '0');
    lastShare = E.formatResult(sm, { name: load(LS.name, ''), title: pack.title, total: pack.words.length,
      date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` });
    $('shareText').value = lastShare; $('shareMsg').textContent = '';
    show('result');
  }
  let lastShare = '';
  function copyText(t) {
    const ta = $('shareText'); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => ($('shareMsg').textContent = '복사됨 — 카톡에 붙여넣기'), () => {});
    $('shareMsg').textContent = ok ? '복사됨 — 카톡에 붙여넣기' : '길게 눌러 전체 선택 후 복사하세요';
  }
  $('shareBtn').addEventListener('click', async () => {
    if (navigator.share) { try { await navigator.share({ text: lastShare }); $('shareMsg').textContent = '보냈어요'; return; } catch (e) { if (e.name === 'AbortError') return; } }
    copyText(lastShare);
  });
  $('copyBtn').addEventListener('click', () => copyText(lastShare));
  $('again').addEventListener('click', () => start(pack));
  $('toHome').addEventListener('click', () => { renderHome(); show('home'); });

  renderHome();
  $('ver').textContent = 'v' + (window.VOCA_BUILD || '');
  $('forceUpdate').addEventListener('click', async () => {
    $('updMsg').textContent = '확인 중…';
    try {
      // 같은 오리진의 다른 앱(회화 단어, talk-*) 캐시·워커는 건드리지 않는다
      if ('caches' in window) for (const k of await caches.keys()) if (k.startsWith('v-')) await caches.delete(k);
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (location.href.startsWith(r.scope)) await r.unregister();
    } catch {}
    location.replace(location.pathname + '?t=' + Date.now());
  });
  // 새 버전 자동 반영: 앱을 열거나 다시 화면에 올 때 sw.js 갱신 확인 → 새 워커가 잡히면 한 번 새로고침
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => reg.update().catch(() => {});
      check();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 10 * 60 * 1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true;
      if (!document.getElementById('card').classList.contains('on')) location.reload();
    });
  }
})();
</script>
