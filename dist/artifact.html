  .toast { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(17,19,24,.92); font-size: 30px; font-weight: 800; text-align: center; padding: 24px; line-height: 1.4; z-index: 9; }

<script>
// 단어 암기 게임 엔진 — 순수 로직 (브라우저·node 공용)
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VocaEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const PHASES = ['en2ko', 'ko2en'];

  function fisherYates(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function allIdx(words) {
    return words.map((_, i) => i);
  }

  function createSession(words, opts) {
    opts = opts || {};
    const shuffle = opts.shuffle || fisherYates;
    return {
      words,
      shuffle,
      phase: PHASES[0],
      pass: 1,
      queue: shuffle(allIdx(words)),
      pos: 0,
      wrong: [],
      rounds: [{ phase: PHASES[0], pass: 1, ok: 0, ng: 0 }],
      misses: words.map(() => 0),
      startedAt: Date.now(),
      finishedAt: null,
    };
  }

  function current(s) {
    if (s.phase === 'done') return null;
    const w = s.words[s.queue[s.pos]];
    return {
      word: w,
      index: s.pos,
      total: s.queue.length,
      prompt: s.phase === 'en2ko' ? w.en : w.ko,
      answer: s.phase === 'en2ko' ? w.ko : w.en,
    };
  }

  function answer(s, ok) {
    if (s.phase === 'done') return { type: 'done' };
    const idx = s.queue[s.pos];
    const round = s.rounds[s.rounds.length - 1];
    if (ok) round.ok++;
    else {
      round.ng++;
      s.wrong.push(idx);
      s.misses[idx]++;
    }
    s.pos++;
    if (s.pos < s.queue.length) return { type: 'next' };

    if (s.wrong.length > 0) {
      s.pass++;
      s.queue = s.shuffle(s.wrong);
      s.wrong = [];
      s.pos = 0;
      s.rounds.push({ phase: s.phase, pass: s.pass, ok: 0, ng: 0 });
      return { type: 'retry', count: s.queue.length };
    }

    const next = PHASES[PHASES.indexOf(s.phase) + 1];
    if (!next) {
      s.phase = 'done';
      s.finishedAt = Date.now();
      return { type: 'done' };
    }
    s.phase = next;
    s.pass = 1;
    s.queue = s.shuffle(allIdx(s.words));
    s.wrong = [];
    s.pos = 0;
    s.rounds.push({ phase: next, pass: 1, ok: 0, ng: 0 });
    return { type: 'phase', phase: next };
  }

  function summary(s) {
    const weak = s.words
      .map((w, i) => ({ en: w.en, ko: w.ko, misses: s.misses[i] }))
      .filter((w) => w.misses > 0)
      .sort((a, b) => b.misses - a.misses);
    return {
      rounds: s.rounds.map((r) => ({ ...r })),
      weak,
      elapsedMs: (s.finishedAt || Date.now()) - s.startedAt,
    };
  }

  // 붙여넣기 텍스트 → 단어 목록. 구분자: 탭 · " - " · " : " · 2칸 이상 공백
  function parsePack(text) {
    const out = [];
    text.split(/\r?\n/).forEach((line) => {
      const t = line.trim().replace(/^\d+[.)]?\s+/, '');
      if (!t) return;
      const m = t.match(/^(.+?)(?:\t+|\s+-\s+|\s+:\s+|\s{2,})(.+)$/);
      if (!m) return;
      out.push({ n: out.length + 1, en: m[1].trim(), ko: m[2].trim() });
    });
    return out;
  }

  return { createSession, current, answer, summary, parsePack, fisherYates };
});

</script>

<script>
(function () {
  const E = window.VocaEngine;
  const $ = (id) => document.getElementById(id);
  const LS = { packs: 'voca:packs', sessions: 'voca:sessions', secs: 'voca:secs' };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let secs = load(LS.secs, 5);
  let packs = [...window.VOCA_PACKS, ...load(LS.packs, [])];
  let session = null, pack = null, timer = null, revealed = false, shownAt = 0;

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ---- 홈
  function renderHome() {
    document.querySelectorAll('#secs button').forEach(b => b.classList.toggle('sel', +b.dataset.s === secs));
    $('packs').innerHTML = packs.map((p, i) =>
      `<div class="item" data-i="${i}"><div><b>${p.title}</b><div class="sub">${p.words.length}단어</div></div><span>▶</span></div>`).join('');
    const ss = load(LS.sessions, []);
    $('recentWrap').style.display = ss.length ? '' : 'none';
    $('recent').innerHTML = ss.slice(-10).reverse().map(s =>
      `<div>${s.date} · ${s.title} · ${fmt(s.elapsedMs)} · 틀림 ${s.totalNg}회</div>`).join('');
  }
  $('secs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; secs = +b.dataset.s; save(LS.secs, secs); renderHome(); });
  $('packs').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) start(packs[+it.dataset.i]); });
  $('addPack').addEventListener('click', () => {
    const words = E.parsePack($('newText').value);
    if (words.length < 2) { $('addMsg').textContent = '2단어 이상 필요해요'; return; }
    const p = { pack_id: 'custom-' + Date.now(), title: $('newTitle').value.trim() || `내 단어팩 (${words.length})`, words };
    const custom = load(LS.packs, []); custom.push(p); save(LS.packs, custom);
    packs = [...window.VOCA_PACKS, ...custom];
    $('newText').value = ''; $('newTitle').value = ''; $('addMsg').textContent = `추가됨: ${p.title}`;
    renderHome();
  });

  // ---- 게임
  function start(p) {
    pack = p; session = E.createSession(p.words);
    show('card'); showCard();
  }
  function phaseName(ph) { return ph === 'en2ko' ? '1차 영어 → 뜻' : '2차 뜻 → 영어'; }

  function showCard() {
    const c = E.current(session);
    if (!c) return finish();
    revealed = false;
    $('phaseLabel').textContent = `${phaseName(session.phase)} · ${session.pass}회차`;
    $('posLabel').textContent = `${c.index + 1} / ${c.total}`;
    $('prog').style.width = (c.index / c.total * 100) + '%';
    $('prompt').textContent = c.prompt;
    $('prompt').className = 'prompt' + (session.phase === 'ko2en' ? ' ko' : '');
    $('answer').textContent = '';
    $('answer').className = 'answer' + (session.phase === 'ko2en' ? ' en' : '');
    $('ring').style.display = '';
    $('hint').style.display = '';
    $('judge').classList.remove('on');
    startCountdown();
  }

  const CIRC = 2 * Math.PI * 52;
  function startCountdown() {
    clearInterval(timer);
    const t0 = performance.now(), total = secs * 1000;
    $('ringFg').style.strokeDasharray = CIRC; $('ringFg').style.strokeDashoffset = 0;
    $('num').textContent = secs;
    timer = setInterval(() => {
      const el = performance.now() - t0, left = Math.max(0, total - el);
      $('num').textContent = Math.ceil(left / 1000);
      $('ringFg').style.strokeDashoffset = CIRC * (el / total);
      if (left <= 0) reveal();
    }, 50);
  }

  function reveal() {
    if (revealed) return;
    revealed = true; clearInterval(timer);
    const c = E.current(session);
    $('answer').textContent = c.answer;
    $('ring').style.display = 'none';
    $('hint').style.display = 'none';
    $('judge').classList.add('on');
    shownAt = Date.now();
  }

  function judge(ok) {
    if (!revealed) return;
    const ev = E.answer(session, ok);
    if (ev.type === 'retry') toast(`틀린 ${ev.count}개 다시!`, `${session.pass}회차`, showCard);
    else if (ev.type === 'phase') toast('1차 완료 🎯', '이제 뜻을 보고 영어를 떠올려요', showCard);
    else if (ev.type === 'done') finish();
    else showCard();
  }

  function toast(main, sub, next) {
    $('toast').innerHTML = `<div>${main}<small>${sub}</small></div>`;
    $('toast').classList.add('on');
    setTimeout(() => { $('toast').classList.remove('on'); next(); }, 900);
  }

  $('stage').addEventListener('click', reveal);
  $('btnX').addEventListener('click', () => judge(false));
  $('btnO').addEventListener('click', () => judge(true));
  document.addEventListener('keydown', e => {
    if (!document.getElementById('card').classList.contains('on')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealed ? judge(true) : reveal(); }
    else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'o') judge(true);
    else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'x') judge(false);
  });

  // ---- 결과
  function fmt(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}분 ${s % 60}초`; }
  function finish() {
    clearInterval(timer);
    const sm = E.summary(session);
    $('elapsed').textContent = fmt(sm.elapsedMs);
    $('resultTitle').textContent = pack.title;
    $('roundsTbl').innerHTML = '<tr><th>단계</th><th>회차</th><th class="ok">O</th><th class="ng">X</th></tr>' +
      sm.rounds.map(r => `<tr><td>${phaseName(r.phase)}</td><td>${r.pass}</td><td class="ok">${r.ok}</td><td class="ng">${r.ng}</td></tr>`).join('');
    $('weakWrap').innerHTML = sm.weak.length
      ? `<div class="sub">많이 틀린 단어</div><table>${sm.weak.slice(0, 5).map(w => `<tr><td><b>${w.en}</b></td><td>${w.ko}</td><td class="ng">${w.misses}회</td></tr>`).join('')}</table>`
      : '<div class="sub">한 번도 안 틀렸어요! 👏</div>';
    const ss = load(LS.sessions, []);
    ss.push({ date: new Date().toISOString().slice(0, 10), title: pack.title, elapsedMs: sm.elapsedMs,
      totalNg: sm.rounds.reduce((a, r) => a + r.ng, 0), weak: sm.weak.slice(0, 10) });
    save(LS.sessions, ss.slice(-50));
    show('result');
  }
  $('again').addEventListener('click', () => start(pack));
  $('toHome').addEventListener('click', () => { renderHome(); show('home'); });

  renderHome();
})();
</script>
