<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-title" content="단어게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>단어 게임</title>
<style>
  :root {
    --bg: #111318; --card: #1c1f27; --fg: #f3f4f6; --muted: #9096a6;
    --accent: #5b8cff; --ok: #2ecc71; --ng: #ff5c5c; --ring: #2a2e3a; --violet: #7c5cff; --amber: #ffb84d;
  }
  html { font-size: 17px; }               /* 터치 기기에서는 JS가 화면 폭에 맞춰 키움 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 1rem; }
  body { display: flex; flex-direction: column; min-height: 100dvh; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; }
  .screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 34rem; margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  h1 { font-size: 1.6rem; margin: .4rem 0 1rem; }
  .sub { color: var(--muted); font-size: .9rem; }
  .sub .done { color: var(--accent); font-weight: 700; }
  .list { display: flex; flex-direction: column; gap: .8rem; }
  .item { background: var(--card); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: .8rem; }
  .item b { font-size: 1.15rem; line-height: 1.3; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: .9rem; padding: .9rem 1.1rem; font-size: 1.05rem; font-weight: 700; cursor: pointer; min-height: 3rem; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--card); border-radius: .8rem; padding: .25rem; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: .6rem 1rem; border-radius: .6rem; font-size: 1rem; font-weight: 700; min-height: 2.6rem; }
  .seg button.sel { background: var(--accent); color: #fff; }
  .seg.tabs { display: flex; width: 100%; }
  .seg.tabs button { flex: 1; padding: .6rem .4rem; }
  textarea { width: 100%; min-height: 9rem; background: var(--card); color: var(--fg); border: 1px solid var(--ring); border-radius: .8rem; padding: .8rem; font-size: 1rem; }
  input[type=text] { width: 100%; background: var(--card); color: var(--fg); border: 1px solid var(--ring); border-radius: .8rem; padding: .8rem; font-size: 1rem; margin-bottom: .6rem; }
  details { margin-top: 1.4rem; }
  summary { cursor: pointer; color: var(--muted); font-size: 1rem; padding: .5rem 0; }

  /* 홈 팩 행 */
  .item .acts { display: flex; gap: .6rem; }
  .item .acts button { flex: 1; border: 0; border-radius: .8rem; padding: .9rem; font-size: 1.05rem; font-weight: 800; color: #fff; cursor: pointer; min-height: 3.2rem; }
  .item .acts .study { background: var(--violet); } .item .acts .test { background: var(--accent); } .item .acts .write { background: var(--amber); color: #1a1a1a; }
  /* 쓰기 시험 */
  .wstage { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; padding: 1rem 0; }
  .wstage .prompt.ko { font-size: 1.6rem; }
  .wmask { font-size: 2.4rem; font-weight: 800; letter-spacing: .12em; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  .wmask b { color: var(--fg); }
  .wlisten { background: var(--violet); color: #fff; border: 0; border-radius: 1.2rem; padding: 1.2rem 1.6rem; font-size: 1.4rem; font-weight: 800; cursor: pointer; }
  .winput { width: 100%; font-size: 1.7rem; font-weight: 700; text-align: center; padding: .9rem; margin: 0; }
  .winput.ok { border-color: var(--ok); } .winput.ng { border-color: var(--ng); }
  .wfb { min-height: 2.4rem; font-size: 1.3rem; line-height: 1.4; word-break: keep-all; }
  .wfb .diff { font-size: 2.2rem; font-weight: 800; letter-spacing: .06em; }
  .wfb .diff i { font-style: normal; color: var(--ng); text-decoration: underline; }
  .wfb .ans { color: var(--accent); font-weight: 700; }
  .wfb .why { color: var(--amber); font-weight: 700; display: block; margin-top: .3rem; }
  .wfb .ask { color: var(--muted); font-size: 1rem; display: block; margin-top: .3rem; }
  #wJudge { height: 5.5rem; width: 100%; }
  #wJudge button { font-size: 2.4rem; }

  /* 테스트 카드 */
  #card { justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; color: var(--muted); }
  .top .phase { color: var(--fg); font-weight: 700; }
  .prog { height: .3rem; background: var(--ring); border-radius: .15rem; margin-top: .6rem; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.4rem; padding: .8rem 0; }
  .prompt { font-size: 3rem; font-weight: 800; line-height: 1.2; word-break: keep-all; }
  .prompt.ko { font-size: 1.9rem; font-weight: 700; }
  .answer { font-size: 1.9rem; font-weight: 700; color: var(--accent); line-height: 1.35; word-break: keep-all; min-height: 1.4em; }
  .answer.en { font-size: 3rem; font-weight: 800; }
  .ring { position: relative; width: 8rem; height: 8rem; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bg { stroke: var(--ring); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; }
  .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: .95rem; }
  .judge { display: none; gap: .8rem; height: 8rem; }
  .judge.on { display: flex; }
  .judge button { flex: 1; border: 0; border-radius: 1.2rem; font-size: 3.6rem; font-weight: 900; color: #fff; cursor: pointer; }
  .judge .x { background: var(--ng); }
  .judge .o { background: var(--ok); }
  .judge button:active { filter: brightness(1.15); transform: scale(.98); }
  .toast { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(17,19,24,.92); font-size: 2rem; font-weight: 800; text-align: center; padding: 1.5rem; line-height: 1.4; z-index: 9; }
  .toast.on { display: flex; }
  .toast small { display: block; font-size: 1.05rem; color: var(--muted); margin-top: .6rem; font-weight: 500; }

  /* 카드 학습 */
  #study { padding-bottom: 0; }
  .sbody { flex: 1; overflow-y: auto; padding-bottom: .8rem; }
  .scard { background: var(--card); border-radius: 1.3rem; padding: 1.3rem 1.1rem; margin-top: .8rem; display: flex; flex-direction: column; gap: .9rem; }
  .sword { font-size: 2.6rem; font-weight: 800; line-height: 1.15; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; word-break: keep-all; }
  .spk { background: var(--ring); color: var(--fg); border: 0; border-radius: 50%; width: 3rem; height: 3rem; font-size: 1.4rem; cursor: pointer; flex: none; }
  .spk.sm { width: 2.6rem; height: 2.6rem; font-size: 1.1rem; }
  .ipa { color: var(--muted); font-size: 1.05rem; font-family: "Charis SIL", "Doulos SIL", "Times New Roman", serif; }
  .stress { font-size: 1.15rem; letter-spacing: .02em; color: var(--muted); }
  .stress b { color: var(--amber); font-size: 1.4rem; }
  .semoji { font-size: 3.6rem; line-height: 1; text-align: center; padding: .3rem 0; }
  .smean { font-size: 1.3rem; font-weight: 700; color: #a9c1ff; line-height: 1.4; word-break: keep-all; }
  .sec { border-top: 1px solid var(--ring); padding-top: .8rem; }
  .sec .lab { font-size: .8rem; color: var(--muted); letter-spacing: .06em; margin-bottom: .4rem; }
  .sex { font-size: 1.2rem; line-height: 1.45; display: flex; gap: .5rem; align-items: flex-start; }
  .sex .en { flex: 1; } .sex .en mark { background: transparent; color: var(--amber); font-weight: 800; }
  .sexko { color: var(--muted); font-size: 1rem; margin-top: .3rem; line-height: 1.4; }
  .smn { font-size: 1.1rem; line-height: 1.55; background: #26223a; border-radius: .8rem; padding: .8rem; word-break: keep-all; }
  .pron { display: flex; flex-direction: column; gap: .7rem; }
  .rec { background: var(--ng); color: #fff; border: 0; border-radius: .9rem; padding: 1rem; font-size: 1.15rem; font-weight: 800; cursor: pointer; min-height: 3.4rem; }
  .rec.on { background: #b23b3b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .heard { font-size: 1.05rem; line-height: 1.45; } .heard b { font-size: 1.3rem; }
  canvas.env { width: 100%; height: 4.5rem; background: #15171e; border-radius: .7rem; }
  .snav { display: flex; gap: .6rem; padding: .6rem 0 max(.8rem, env(safe-area-inset-bottom)); }
  .snav button { flex: 1; background: var(--card); color: var(--fg); border: 0; border-radius: .9rem; padding: 1rem .5rem; font-size: 1.25rem; font-weight: 800; cursor: pointer; min-height: 3.6rem; }
  .snav button.prim { background: var(--violet); color: #fff; }
  .snav button:disabled { opacity: .35; }

  /* 결과 */
  table { width: 100%; border-collapse: collapse; margin: .6rem 0 1.1rem; }
  td, th { padding: .5rem .4rem; text-align: left; border-bottom: 1px solid var(--ring); font-size: 1rem; }
  th { color: var(--muted); font-weight: 600; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  .big { font-size: 2.6rem; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }
</style>
</head>
<body>

<!-- 홈 -->
<section id="home" class="screen on">
  <h1>📚 단어 게임 <span class="sub" id="ver" style="font-weight:400"></span></h1>
  <div class="row" style="margin-bottom:.8rem">
    <span class="sub">이름</span>
    <input type="text" id="userName" placeholder="예: 연우" style="width:9rem;margin:0;padding:.55rem .8rem" maxlength="10">
  </div>
  <div class="row" style="margin-bottom:1rem">
    <span class="sub">보여주는 시간</span>
    <div class="seg" id="secs">
      <button data-s="3">3초</button><button data-s="5">5초</button><button data-s="7">7초</button>
    </div>
  </div>
  <div class="seg tabs" id="bookTabs" style="margin-bottom:.8rem"></div>
  <div class="list" id="packs"></div>
  <details>
    <summary>+ 단어팩 붙여넣기로 추가</summary>
    <p class="sub">한 줄에 한 단어. <code>영어[탭]뜻</code> 또는 <code>영어 - 뜻</code> 형식.</p>
    <input type="text" id="newTitle" placeholder="팩 이름 (예: DAY 04)">
    <textarea id="newText" placeholder="pack&#9;(짐을) 싸다&#10;male - 남성의"></textarea>
    <div class="row" style="margin-top:.6rem"><button class="btn" id="addPack">추가</button><span class="sub" id="addMsg"></span></div>
  </details>
  <div class="row" style="margin-top:1.2rem"><button class="btn ghost" id="forceUpdate" style="font-size:.95rem">🔄 새 버전 확인</button><span class="sub" id="updMsg"></span></div>
  <details id="recentWrap" style="display:none">
    <summary>최근 기록</summary>
    <div id="recent" class="sub"></div>
  </details>
</section>

<!-- 카드 -->
<section id="card" class="screen">
  <div>
    <div class="top"><span class="phase" id="phaseLabel"></span><span id="posLabel"></span></div>
    <div class="prog"><i id="prog"></i></div>
  </div>
  <div class="stage" id="stage">
    <div class="prompt" id="prompt"></div>
    <div class="ring" id="ring">
      <svg width="120" height="120" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
      <div class="num" id="num">5</div>
    </div>
    <div class="answer" id="answer"></div>
    <div class="hint" id="hint">화면을 누르면 바로 정답</div>
  </div>
  <div class="judge" id="judge">
    <button class="x" id="btnX">X</button>
    <button class="o" id="btnO">O</button>
  </div>
</section>

<!-- 카드 학습 -->
<section id="study" class="screen">
  <div class="top"><button class="btn ghost" id="studyHome" style="padding:.5rem .9rem;font-size:1rem;min-height:2.6rem">‹ 홈</button><span id="studyPos"></span></div>
  <div class="sbody" id="sbody">
    <div class="scard" id="scard"></div>
  </div>
  <div class="snav">
    <button id="sPrev">‹ 이전</button>
    <button id="sSpeak" class="prim">🔊 듣기</button>
    <button id="sNext">다음 ›</button>
  </div>
</section>

<!-- 결과 -->
<section id="write" class="screen">
  <div>
    <div class="top"><span class="phase" id="wPhase"></span><span id="wPos"></span></div>
    <div class="prog"><i id="wProg"></i></div>
  </div>
  <div class="wstage">
    <div class="prompt" id="wPrompt"></div>
    <div class="wmask" id="wMask" hidden></div>
    <button class="wlisten" id="wListen" hidden>🔊 다시 듣기</button>
    <input type="text" class="winput" id="wInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="wfb" id="wFb"></div>
    <div class="judge" id="wJudge"><button class="x" id="wX">X</button><button class="o" id="wO">O</button></div>
    <div class="row" style="width:100%">
      <button class="btn" id="wSubmit" style="flex:1">확인</button>
      <button class="btn ghost" id="wHome">홈</button>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <h1>🎉 다 외웠다!</h1>
  <div class="big" id="elapsed"></div>
  <div class="sub" id="resultTitle"></div>
  <table id="roundsTbl"></table>
  <div id="weakWrap"></div>
  <div class="sec" style="margin-top:.8rem">
    <div class="row"><button class="btn" id="shareBtn" style="background:#f7c948;color:#1a1a1a">📤 결과 보내기 (카톡)</button><button class="btn ghost" id="copyBtn">복사</button><span class="sub" id="shareMsg"></span></div>
    <textarea id="shareText" readonly style="margin-top:.6rem;min-height:7rem;font-size:.95rem"></textarea>
  </div>
  <div class="row" style="margin-top:1rem">
    <button class="btn" id="again">다시 하기</button>
    <button class="btn ghost" id="toHome">홈으로</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
// 단어 암기 게임 엔진 — 순수 로직 (브라우저·node 공용)
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VocaEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const PHASES = ['en2ko', 'ko2en'];
  // 쓰기 시험: 힌트 한→영 · 백지 한→영 · 영→한 · 듣고 쓰기
  const WRITE_PHASES = ['hint', 'blank', 'ko', 'dict'];
  const ANSWER_EN = { ko2en: 1, hint: 1, blank: 1, dict: 1 };

  function fisherYates(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function allIdx(words) {
    return words.map((_, i) => i);
  }

  function createSession(words, opts) {
    opts = opts || {};
    const shuffle = opts.shuffle || fisherYates;
    const phases = opts.phases || PHASES;
    return {
      words,
      shuffle,
      phases,
      phase: phases[0],
      pass: 1,
      queue: shuffle(allIdx(words)),
      pos: 0,
      wrong: [],
      rounds: [{ phase: phases[0], pass: 1, ok: 0, ng: 0 }],
      misses: words.map(() => 0),
      startedAt: Date.now(),
      finishedAt: null,
    };
  }

  function current(s) {
    if (s.phase === 'done') return null;
    const w = s.words[s.queue[s.pos]];
    return {
      word: w,
      index: s.pos,
      total: s.queue.length,
      prompt: ANSWER_EN[s.phase] ? w.ko : w.en,
      answer: ANSWER_EN[s.phase] ? w.en : w.ko,
    };
  }

  function answer(s, ok) {
    if (s.phase === 'done') return { type: 'done' };
    const idx = s.queue[s.pos];
    const round = s.rounds[s.rounds.length - 1];
    if (ok) round.ok++;
    else {
      round.ng++;
      s.wrong.push(idx);
      s.misses[idx]++;
    }
    s.pos++;
    if (s.pos < s.queue.length) return { type: 'next' };

    if (s.wrong.length > 0) {
      s.pass++;
      s.queue = s.shuffle(s.wrong);
      s.wrong = [];
      s.pos = 0;
      s.rounds.push({ phase: s.phase, pass: s.pass, ok: 0, ng: 0 });
      return { type: 'retry', count: s.queue.length };
    }

    const phases = s.phases || PHASES;
    const next = phases[phases.indexOf(s.phase) + 1];
    if (!next) {
      s.phase = 'done';
      s.finishedAt = Date.now();
      return { type: 'done' };
    }
    s.phase = next;
    s.pass = 1;
    s.queue = s.shuffle(allIdx(s.words));
    s.wrong = [];
    s.pos = 0;
    s.rounds.push({ phase: next, pass: 1, ok: 0, ng: 0 });
    return { type: 'phase', phase: next };
  }

  function summary(s) {
    const weak = s.words
      .map((w, i) => ({ en: w.en, ko: w.ko, misses: s.misses[i] }))
      .filter((w) => w.misses > 0)
      .sort((a, b) => b.misses - a.misses);
    return {
      rounds: s.rounds.map((r) => ({ ...r })),
      weak,
      elapsedMs: (s.finishedAt || Date.now()) - s.startedAt,
    };
  }

  // 붙여넣기 텍스트 → 단어 목록. 구분자: 탭 · " - " · " : " · 2칸 이상 공백
  function parsePack(text) {
    const out = [];
    text.split(/\r?\n/).forEach((line) => {
      const t = line.trim().replace(/^\d+[.)]?\s+/, '');
      if (!t) return;
      const m = t.match(/^(.+?)(?:\t+|\s+-\s+|\s+:\s+|\s{2,})(.+)$/);
      if (!m) return;
      out.push({ n: out.length + 1, en: m[1].trim(), ko: m[2].trim() });
    });
    return out;
  }

  // ---- 발음 연습 보조
  function norm(t) { return String(t || '').toLowerCase().replace(/[^a-z' ]+/g, ' ').trim().split(/\s+/).filter(Boolean); }
  function lev(a, b) {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function sim(a, b) { const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; }
  // 목표 단어(구) vs 음성인식 결과 → 0..1. 단어 하나면 철자 유사도, 구면 단어별 적중 비율(유사도 0.8 이상=적중)
  function pronunciationScore(target, heard) {
    const t = norm(target), h = norm(heard);
    if (!t.length) return 0;
    if (!h.length) return 0;
    const best = (w) => Math.max(...h.map((x) => sim(w, x)));
    if (t.length === 1) return best(t[0]);
    return t.filter((w) => best(w) >= 0.8).length / t.length;
  }
  // "be FA-mous for" → [{text, stressed}]  (대문자 음절 = 강세)
  function stressSyllables(pattern) {
    return String(pattern || '').split(/[\s-]+/).filter(Boolean).map((tok) => ({
      text: tok.toLowerCase(),
      stressed: /[A-Z]/.test(tok) && tok === tok.toUpperCase(),
    }));
  }

  // 결과 공유용 텍스트 (카톡 복붙용 · 이모지 없음)
  function formatResult(sm, meta) {
    const s = Math.round(sm.elapsedMs / 1000);
    const time = `${Math.floor(s / 60)}분 ${s % 60}초`;
    const phaseLine = (ph, label) => {
      const rs = sm.rounds.filter((r) => r.phase === ph);
      if (!rs.length) return null;
      return `${label}: ` + rs.map((r) => `${r.pass}회차 ${r.ok}/${r.ok + r.ng}`).join(', ');
    };
    const weak = sm.weak.length ? sm.weak.map((w) => `${w.en}(${w.misses})`).join(', ') : '없음 (전부 한 번에 통과)';
    const kindLabel = meta.kind === 'write' ? '쓰기 시험' : '단어 게임';
    return [
      `[${meta.name ? meta.name + ' ' : ''}${kindLabel} 결과] ${meta.date}`,
      `${meta.title} (${meta.total}단어) · ${time}`,
      phaseLine('en2ko', '1차 영어→뜻'),
      phaseLine('ko2en', '2차 뜻→영어'),
      phaseLine('hint', '1차 힌트 쓰기'),
      phaseLine('blank', '2차 백지 쓰기'),
      phaseLine('ko', '3차 뜻 쓰기'),
      phaseLine('dict', '4차 듣고 쓰기'),

  }

  // 완료 횟수 원장 — { [팩키]: { test: n, study: n, last: 'YYYY-MM-DD' } } (입력 불변)

    const d = Object.assign({}, done || {});
    const cur = Object.assign({ test: 0, study: 0, last: '' }, d[key]);
    cur[kind] = (cur[kind] || 0) + 1;
    cur.last = date;
    d[key] = cur;
    return d;
  }
  // 예전 세션 기록(제목만 있음)으로 테스트 완료 횟수 1회 백필
  function doneFromSessions(sessions, titleToKey) {
    let d = {};
    (sessions || []).forEach((s) => { const k = titleToKey[s.title]; if (k) d = bumpDone(d, k, 'test', s.date || ''); });
    return d;
  }
  function doneLabel(rec) {
    if (!rec || (!rec.test && !rec.study && !rec.write)) return '';
    const parts = [];
    if (rec.test) parts.push(`✅ 테스트 ${rec.test}회`);
    if (rec.write) parts.push(`✍️ 쓰기 ${rec.write}회`);
    if (rec.study) parts.push(`🃏 카드 ${rec.study}회`);
    if (rec.last) { const [, m, dd] = rec.last.split('-'); parts.push(`최근 ${+m}/${+dd}`); }

  }

  // ---- 쓰기 시험 보조
  // 힌트용 부분 빈칸: 각 낱말의 첫 글자는 남기고 나머지 글자의 약 40%를 '_'로. rand 주입 가능(테스트용)
  function maskWord(word, rand) {
    rand = rand || Math.random;
    const chars = String(word).split('');
    const cand = [];
    chars.forEach((c, i) => {
      if (!/[A-Za-z]/.test(c)) return;
      if (i === 0 || !/[A-Za-z]/.test(chars[i - 1])) return; // 낱말 첫 글자
      cand.push(i);
    });
    if (!cand.length) return chars.join('');
    const n = Math.max(1, Math.round(cand.length * 0.4));
    for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }

  function gradeEn(target, typed) {
    const a = normEn(target), b = normEn(typed);
    if (a === b) return { ok: true, diff: null };
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const okIdx = new Set();
    for (let i = 0, j = 0; i < m && j < n;) {
      if (a[i] === b[j]) { okIdx.add(i); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;

  function senseList(text, keepParens) {
    let t = String(text || '');
    t = keepParens ? t.replace(/[()]/g, '') : t.replace(/\([^)]*\)/g, '');
    const out = [];
    t.split(/\s*\d+\.\s*|\s*,\s*|\s*;\s*/).map((x) => x.replace(/^\[[^\]]*\]\s*/, '').trim()).filter(Boolean).forEach((sense) => {
      const m = sense.match(/^(.*?)(\S+)\[([^\]]+)\](.*)$/); // 앞말[대체1/대체2]뒷말
      if (!m) { out.push(sense.replace(/\s+/g, ' ').trim()); return; }
      const [, pre, head, alts, tail] = m;
      out.push((pre + head + tail).trim());

  const BOOKS = [['neungyul-voca-', '능률VOCA'], ['reading-tutor-', '리딩튜터']];

<script>
(function () {
  const E = window.VocaEngine;

  // ---- 화면 폭에 맞춘 글자 크기 (터치 기기: 폭/23, 17~40px · 마우스 기기: 17px)
  function applyScale(coarse, width) {
    const px = coarse ? Math.max(17, Math.min(40, width / 23)) : 17;
    document.documentElement.style.fontSize = px + 'px';
    return px;
  }
  window.__applyScale = applyScale;
  const coarse = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  applyScale(coarse(), window.innerWidth);
  window.addEventListener('resize', () => applyScale(coarse(), window.innerWidth));
  const $ = (id) => document.getElementById(id);
  const LS = { packs: 'voca:packs', sessions: 'voca:sessions', secs: 'voca:secs', name: 'voca:name', done: 'voca:done', tab: 'voca:tab' };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let secs = load(LS.secs, 5);
  let packs = [...window.VOCA_PACKS, ...load(LS.packs, [])];
  let session = null, pack = null, timer = null, revealed = false, shownAt = 0;
  // 완료 횟수: 팩키=pack_id(없으면 제목). 첫 실행 시 예전 세션 기록에서 테스트 횟수 백필
  const packKey = (p) => p.pack_id || p.title;
  const today = () => { const d = new Date(), z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
  let done = load(LS.done, null);
  if (!done) { done = E.doneFromSessions(load(LS.sessions, []), Object.fromEntries(packs.map(p => [p.title, packKey(p)]))); save(LS.done, done); }
  const markDone = (p, kind) => { done = E.bumpDone(done, packKey(p), kind, today()); save(LS.done, done); };

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ---- 홈
  function renderHome() {
    document.querySelectorAll('#secs button').forEach(b => b.classList.toggle('sel', +b.dataset.s === secs));
    const groups = E.groupPacks(packs), tab = E.pickTab(groups, load(LS.tab, null));
    $('bookTabs').innerHTML = groups.map(g => `<button data-book="${g.book}" class="${g.book === tab ? 'sel' : ''}">${g.book} <span style="font-weight:400;opacity:.75">${g.items.length}</span></button>`).join('');

  let recOn = false, mediaRec = null, stream = null, mineUrl = null, envTimer = null, envData = [], recog = null;
  async function toggleRec() { recOn ? stopRec() : startRec(); }
  async function startRec() {

    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => ($('shareMsg').textContent = '복사됨 — 카톡에 붙여넣기'), () => {});
    $('shareMsg').textContent = ok ? '복사됨 — 카톡에 붙여넣기' : '길게 눌러 전체 선택 후 복사하세요';
  }
  $('shareBtn').addEventListener('click', async () => {
    if (navigator.share) { try { await navigator.share({ text: lastShare }); $('shareMsg').textContent = '보냈어요'; return; } catch (e) { if (e.name === 'AbortError') return; } }
    copyText(lastShare);
  });
  $('copyBtn').addEventListener('click', () => copyText(lastShare));
  $('again').addEventListener('click', () => (mode === 'write' ? startWrite(pack) : start(pack)));
  $('toHome').addEventListener('click', () => { renderHome(); show('home'); });

  renderHome();
  $('ver').textContent = 'v' + (window.VOCA_BUILD || '');
  $('forceUpdate').addEventListener('click', async () => {
    $('updMsg').textContent = '확인 중…';
    try {
      // 같은 오리진의 다른 앱(회화 단어, talk-*) 캐시·워커는 건드리지 않는다
      if ('caches' in window) for (const k of await caches.keys()) if (k.startsWith('v-')) await caches.delete(k);
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (location.href.startsWith(r.scope)) await r.unregister();
    } catch {}
    location.replace(location.pathname + '?t=' + Date.now());
  });
  // 새 버전 자동 반영: 앱을 열거나 다시 화면에 올 때 sw.js 갱신 확인 → 새 워커가 잡히면 한 번 새로고침
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => reg.update().catch(() => {});
      check();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 10 * 60 * 1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true;
      if (!document.getElementById('card').classList.contains('on')) location.reload();
    });
  }
})();
</script>
</body>
</html>
