<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-title" content="단어게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>단어 게임</title>
<style>
  :root {
    --bg: #111318; --card: #1c1f27; --fg: #f3f4f6; --muted: #9096a6;
    --accent: #5b8cff; --ok: #2ecc71; --ng: #ff5c5c; --ring: #2a2e3a; --violet: #7c5cff; --amber: #ffb84d;
  }
  html { font-size: 17px; }               /* 터치 기기에서는 JS가 화면 폭에 맞춰 키움 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: 1rem; }
  body { display: flex; flex-direction: column; min-height: 100dvh; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; }
  .screen { display: none; flex: 1; flex-direction: column; width: 100%; max-width: 34rem; margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  h1 { font-size: 1.6rem; margin: .4rem 0 1rem; }
  .sub { color: var(--muted); font-size: .9rem; }
  .list { display: flex; flex-direction: column; gap: .8rem; }
  .item { background: var(--card); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: .8rem; }
  .item b { font-size: 1.15rem; line-height: 1.3; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: .9rem; padding: .9rem 1.1rem; font-size: 1.05rem; font-weight: 700; cursor: pointer; min-height: 3rem; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--card); border-radius: .8rem; padding: .25rem; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: .6rem 1rem; border-radius: .6rem; font-size: 1rem; font-weight: 700; min-height: 2.6rem; }
  .seg button.sel { background: var(--accent); color: #fff; }
  textarea { width: 100%; min-height: 9rem; background: var(--card); color: var(--fg); border: 1px solid var(--ring); border-radius: .8rem; padding: .8rem; font-size: 1rem; }
  input[type=text] { width: 100%; background: var(--card); color: var(--fg); border: 1px solid var(--ring); border-radius: .8rem; padding: .8rem; font-size: 1rem; margin-bottom: .6rem; }
  details { margin-top: 1.4rem; }
  summary { cursor: pointer; color: var(--muted); font-size: 1rem; padding: .5rem 0; }

  /* 홈 팩 행 */
  .item .acts { display: flex; gap: .6rem; }
  .item .acts button { flex: 1; border: 0; border-radius: .8rem; padding: .9rem; font-size: 1.05rem; font-weight: 800; color: #fff; cursor: pointer; min-height: 3.2rem; }
  .item .acts .study { background: var(--violet); } .item .acts .test { background: var(--accent); }

  /* 테스트 카드 */
  #card { justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; color: var(--muted); }
  .top .phase { color: var(--fg); font-weight: 700; }
  .prog { height: .3rem; background: var(--ring); border-radius: .15rem; margin-top: .6rem; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.4rem; padding: .8rem 0; }
  .prompt { font-size: 3rem; font-weight: 800; line-height: 1.2; word-break: keep-all; }
  .prompt.ko { font-size: 1.9rem; font-weight: 700; }
  .answer { font-size: 1.9rem; font-weight: 700; color: var(--accent); line-height: 1.35; word-break: keep-all; min-height: 1.4em; }
  .answer.en { font-size: 3rem; font-weight: 800; }
  .ring { position: relative; width: 8rem; height: 8rem; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bg { stroke: var(--ring); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; }
  .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: .95rem; }
  .judge { display: none; gap: .8rem; height: 8rem; }
  .judge.on { display: flex; }
  .judge button { flex: 1; border: 0; border-radius: 1.2rem; font-size: 3.6rem; font-weight: 900; color: #fff; cursor: pointer; }
  .judge .x { background: var(--ng); }
  .judge .o { background: var(--ok); }
  .judge button:active { filter: brightness(1.15); transform: scale(.98); }
  .toast { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(17,19,24,.92); font-size: 2rem; font-weight: 800; text-align: center; padding: 1.5rem; line-height: 1.4; z-index: 9; }
  .toast.on { display: flex; }
  .toast small { display: block; font-size: 1.05rem; color: var(--muted); margin-top: .6rem; font-weight: 500; }

  /* 카드 학습 */
  #study { padding-bottom: 0; }
  .sbody { flex: 1; overflow-y: auto; padding-bottom: .8rem; }
  .scard { background: var(--card); border-radius: 1.3rem; padding: 1.3rem 1.1rem; margin-top: .8rem; display: flex; flex-direction: column; gap: .9rem; }
  .sword { font-size: 2.6rem; font-weight: 800; line-height: 1.15; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; word-break: keep-all; }
  .spk { background: var(--ring); color: var(--fg); border: 0; border-radius: 50%; width: 3rem; height: 3rem; font-size: 1.4rem; cursor: pointer; flex: none; }
  .spk.sm { width: 2.6rem; height: 2.6rem; font-size: 1.1rem; }
  .ipa { color: var(--muted); font-size: 1.05rem; font-family: "Charis SIL", "Doulos SIL", "Times New Roman", serif; }
  .stress { font-size: 1.15rem; letter-spacing: .02em; color: var(--muted); }
  .stress b { color: var(--amber); font-size: 1.4rem; }
  .semoji { font-size: 3.6rem; line-height: 1; text-align: center; padding: .3rem 0; }
  .smean { font-size: 1.3rem; font-weight: 700; color: #a9c1ff; line-height: 1.4; word-break: keep-all; }
  .sec { border-top: 1px solid var(--ring); padding-top: .8rem; }
  .sec .lab { font-size: .8rem; color: var(--muted); letter-spacing: .06em; margin-bottom: .4rem; }
  .sex { font-size: 1.2rem; line-height: 1.45; display: flex; gap: .5rem; align-items: flex-start; }
  .sex .en { flex: 1; } .sex .en mark { background: transparent; color: var(--amber); font-weight: 800; }
  .sexko { color: var(--muted); font-size: 1rem; margin-top: .3rem; line-height: 1.4; }
  .smn { font-size: 1.1rem; line-height: 1.55; background: #26223a; border-radius: .8rem; padding: .8rem; word-break: keep-all; }
  .pron { display: flex; flex-direction: column; gap: .7rem; }
  .rec { background: var(--ng); color: #fff; border: 0; border-radius: .9rem; padding: 1rem; font-size: 1.15rem; font-weight: 800; cursor: pointer; min-height: 3.4rem; }
  .rec.on { background: #b23b3b; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .heard { font-size: 1.05rem; line-height: 1.45; } .heard b { font-size: 1.3rem; }
  canvas.env { width: 100%; height: 4.5rem; background: #15171e; border-radius: .7rem; }
  .snav { display: flex; gap: .6rem; padding: .6rem 0 max(.8rem, env(safe-area-inset-bottom)); }
  .snav button { flex: 1; background: var(--card); color: var(--fg); border: 0; border-radius: .9rem; padding: 1rem .5rem; font-size: 1.25rem; font-weight: 800; cursor: pointer; min-height: 3.6rem; }
  .snav button.prim { background: var(--violet); color: #fff; }
  .snav button:disabled { opacity: .35; }

  /* 결과 */
  table { width: 100%; border-collapse: collapse; margin: .6rem 0 1.1rem; }
  td, th { padding: .5rem .4rem; text-align: left; border-bottom: 1px solid var(--ring); font-size: 1rem; }
  th { color: var(--muted); font-weight: 600; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  .big { font-size: 2.6rem; font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }
</style>
</head>
<body>

<!-- 홈 -->
<section id="home" class="screen on">
  <h1>📚 단어 게임</h1>
  <div class="row" style="margin-bottom:1rem">
    <span class="sub">보여주는 시간</span>
    <div class="seg" id="secs">
      <button data-s="3">3초</button><button data-s="5">5초</button><button data-s="7">7초</button>
    </div>
  </div>
  <div class="list" id="packs"></div>
  <details>
    <summary>+ 단어팩 붙여넣기로 추가</summary>
    <p class="sub">한 줄에 한 단어. <code>영어[탭]뜻</code> 또는 <code>영어 - 뜻</code> 형식.</p>
    <input type="text" id="newTitle" placeholder="팩 이름 (예: DAY 04)">
    <textarea id="newText" placeholder="pack&#9;(짐을) 싸다&#10;male - 남성의"></textarea>
    <div class="row" style="margin-top:.6rem"><button class="btn" id="addPack">추가</button><span class="sub" id="addMsg"></span></div>
  </details>
  <details id="recentWrap" style="display:none">
    <summary>최근 기록</summary>
    <div id="recent" class="sub"></div>
  </details>
</section>

<!-- 카드 -->
<section id="card" class="screen">
  <div>
    <div class="top"><span class="phase" id="phaseLabel"></span><span id="posLabel"></span></div>
    <div class="prog"><i id="prog"></i></div>
  </div>
  <div class="stage" id="stage">
    <div class="prompt" id="prompt"></div>
    <div class="ring" id="ring">
      <svg width="120" height="120" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
      <div class="num" id="num">5</div>
    </div>
    <div class="answer" id="answer"></div>
    <div class="hint" id="hint">화면을 누르면 바로 정답</div>
  </div>
  <div class="judge" id="judge">
    <button class="x" id="btnX">X</button>
    <button class="o" id="btnO">O</button>
  </div>
</section>

<!-- 카드 학습 -->
<section id="study" class="screen">
  <div class="top"><button class="btn ghost" id="studyHome" style="padding:.5rem .9rem;font-size:1rem;min-height:2.6rem">‹ 홈</button><span id="studyPos"></span></div>
  <div class="sbody" id="sbody">
    <div class="scard" id="scard"></div>
  </div>
  <div class="snav">
    <button id="sPrev">‹ 이전</button>
    <button id="sSpeak" class="prim">🔊 듣기</button>
    <button id="sNext">다음 ›</button>
  </div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <h1>🎉 다 외웠다!</h1>
  <div class="big" id="elapsed"></div>
  <div class="sub" id="resultTitle"></div>
  <table id="roundsTbl"></table>
  <div id="weakWrap"></div>
  <div class="row" style="margin-top:auto">
    <button class="btn" id="again">다시 하기</button>
    <button class="btn ghost" id="toHome">홈으로</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script src="packs.js"></script>
<script>
(function () {
  const E = window.VocaEngine;

  // ---- 화면 폭에 맞춘 글자 크기 (터치 기기: 폭/23, 17~40px · 마우스 기기: 17px)
  function applyScale(coarse, width) {
    const px = coarse ? Math.max(17, Math.min(40, width / 23)) : 17;
    document.documentElement.style.fontSize = px + 'px';
    return px;
  }
  window.__applyScale = applyScale;
  const coarse = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  applyScale(coarse(), window.innerWidth);
  window.addEventListener('resize', () => applyScale(coarse(), window.innerWidth));
  const $ = (id) => document.getElementById(id);
  const LS = { packs: 'voca:packs', sessions: 'voca:sessions', secs: 'voca:secs' };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let secs = load(LS.secs, 5);
  let packs = [...window.VOCA_PACKS, ...load(LS.packs, [])];
  let session = null, pack = null, timer = null, revealed = false, shownAt = 0;

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

  // ---- 홈
  function renderHome() {
    document.querySelectorAll('#secs button').forEach(b => b.classList.toggle('sel', +b.dataset.s === secs));
    $('packs').innerHTML = packs.map((p, i) =>
      `<div class="item"><div><b>${p.title}</b><div class="sub">${p.words.length}단어</div></div><div class="acts"><button class="study" data-i="${i}">🃏 카드</button><button class="test" data-i="${i}">⚡ 테스트</button></div></div>`).join('');
    const ss = load(LS.sessions, []);
    $('recentWrap').style.display = ss.length ? '' : 'none';
    $('recent').innerHTML = ss.slice(-10).reverse().map(s =>
      `<div>${s.date} · ${s.title} · ${fmt(s.elapsedMs)} · 틀림 ${s.totalNg}회</div>`).join('');
  }
  $('secs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; secs = +b.dataset.s; save(LS.secs, secs); renderHome(); });
  $('packs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('test')) start(packs[+b.dataset.i]); else startStudy(packs[+b.dataset.i]);
  });
  $('addPack').addEventListener('click', () => {
    const words = E.parsePack($('newText').value);
    if (words.length < 2) { $('addMsg').textContent = '2단어 이상 필요해요'; return; }
    const p = { pack_id: 'custom-' + Date.now(), title: $('newTitle').value.trim() || `내 단어팩 (${words.length})`, words };
    const custom = load(LS.packs, []); custom.push(p); save(LS.packs, custom);
    packs = [...window.VOCA_PACKS, ...custom];
    $('newText').value = ''; $('newTitle').value = ''; $('addMsg').textContent = `추가됨: ${p.title}`;
    renderHome();
  });

  // ---- 게임
  function start(p) {
    pack = p; session = E.createSession(p.words);
    show('card'); showCard();
  }
  function phaseName(ph) { return ph === 'en2ko' ? '1차 영어 → 뜻' : '2차 뜻 → 영어'; }

  function showCard() {
    const c = E.current(session);
    if (!c) return finish();
    revealed = false;
    $('phaseLabel').textContent = `${phaseName(session.phase)} · ${session.pass}회차`;
    $('posLabel').textContent = `${c.index + 1} / ${c.total}`;
    $('prog').style.width = (c.index / c.total * 100) + '%';
    $('prompt').textContent = c.prompt;
    $('prompt').className = 'prompt' + (session.phase === 'ko2en' ? ' ko' : '');
    $('answer').textContent = '';
    $('answer').className = 'answer' + (session.phase === 'ko2en' ? ' en' : '');
    $('ring').style.display = '';
    $('hint').style.display = '';
    $('judge').classList.remove('on');
    startCountdown();
  }

  const CIRC = 2 * Math.PI * 52;
  function startCountdown() {
    clearInterval(timer);
    const t0 = performance.now(), total = secs * 1000;
    $('ringFg').style.strokeDasharray = CIRC; $('ringFg').style.strokeDashoffset = 0;
    $('num').textContent = secs;
    timer = setInterval(() => {
      const el = performance.now() - t0, left = Math.max(0, total - el);
      $('num').textContent = Math.ceil(left / 1000);
      $('ringFg').style.strokeDashoffset = CIRC * (el / total);
      if (left <= 0) reveal();
    }, 50);
  }

  function reveal() {
    if (revealed) return;
    revealed = true; clearInterval(timer);
    const c = E.current(session);
    $('answer').textContent = c.answer;
    $('ring').style.display = 'none';
    $('hint').style.display = 'none';
    $('judge').classList.add('on');
    shownAt = Date.now();
  }

  function judge(ok) {
    if (!revealed) return;
    const ev = E.answer(session, ok);
    if (ev.type === 'retry') toast(`틀린 ${ev.count}개 다시!`, `${session.pass}회차`, showCard);
    else if (ev.type === 'phase') toast('1차 완료 🎯', '이제 뜻을 보고 영어를 떠올려요', showCard);
    else if (ev.type === 'done') finish();
    else showCard();
  }

  function toast(main, sub, next) {
    $('toast').innerHTML = `<div>${main}<small>${sub}</small></div>`;
    $('toast').classList.add('on');
    setTimeout(() => { $('toast').classList.remove('on'); next(); }, 900);
  }

  $('stage').addEventListener('click', reveal);
  $('btnX').addEventListener('click', () => judge(false));
  $('btnO').addEventListener('click', () => judge(true));
  document.addEventListener('keydown', e => {
    if (!document.getElementById('card').classList.contains('on')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealed ? judge(true) : reveal(); }
    else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'o') judge(true);
    else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'x') judge(false);
  });

  // ---- 발음(TTS)
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    return vs.find(v => /Samantha|Google US|Ava|Allison/i.test(v.name)) || vs[0] || null;
  }
  function speak(text, rate) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.85; const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  // ---- 카드 학습
  let sPack = null, sIdx = 0;
  function startStudy(p) { sPack = p; sIdx = 0; show('study'); renderStudy(true); }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function stressHtml(pattern) {
    return String(pattern || '').split(/\s+/).filter(Boolean).map(word =>
      E.stressSyllables(word).map(x => x.stressed ? `<b>${esc(x.text.toUpperCase())}</b>` : esc(x.text)).join('·')
    ).join(' &nbsp;');
  }
  function highlight(sentence, word) {
    const head = word.split(' ').map(x => x.replace(/[^a-z]/gi, '')).sort((a, b) => b.length - a.length)[0];
    if (!head) return esc(sentence);
    return esc(sentence).replace(new RegExp(`\\b(${head}\\w*)`, 'i'), '<mark>$1</mark>');
  }
  function renderStudy(autoSpeak) {
    const w = sPack.words[sIdx];
    stopRec();
    $('studyPos').textContent = `${sIdx + 1} / ${sPack.words.length}`;
    $('scard').innerHTML = `
      <div class="sword"><span>${esc(w.en)}</span><button class="spk" data-say="${esc(w.en)}">🔊</button></div>
      <div><span class="ipa">${esc(w.ipa || '')}</span> &nbsp; <span class="stress">${stressHtml(w.stress)}</span></div>
      ${w.emoji ? `<div class="semoji">${esc(w.emoji)}</div>` : ''}
      <div class="smean">${esc(w.ko)}</div>
      ${w.ex ? `<div class="sec"><div class="lab">예문</div><div class="sex"><div class="en">${highlight(w.ex, w.en)}</div><button class="spk sm" data-say="${esc(w.ex)}">🔊</button></div><div class="sexko">${esc(w.ex_ko || '')}</div></div>` : ''}
      ${w.mnemonic ? `<div class="sec"><div class="lab">💡 이렇게 외워요</div><div class="smn">${esc(w.mnemonic)}</div></div>` : ''}
      <div class="sec pron">
        <div class="lab">🎤 발음 연습 — 강세: <span class="stress">${stressHtml(w.stress)}</span></div>
        <button class="rec" id="recBtn">🎤 녹음하고 따라 말하기</button>
        <div class="heard" id="heard"></div>
        <canvas class="env" id="env" width="600" height="120" style="display:none"></canvas>
        <div class="row" id="recActs" style="display:none"><button class="btn ghost" id="playMine">▶ 내 녹음</button><button class="btn ghost" data-say="${esc(w.en)}">🔊 원어</button></div>
      </div>`;
    $('sPrev').disabled = sIdx === 0;
    $('sNext').textContent = sIdx === sPack.words.length - 1 ? '끝 ✓' : '다음 ›';
    $('sbody').scrollTop = 0;
    if (autoSpeak) speak(w.en);
  }
  $('scard').addEventListener('click', e => {
    const b = e.target.closest('[data-say]'); if (b) { speak(b.dataset.say, b.classList.contains('sm') ? 0.9 : 0.8); return; }
    if (e.target.closest('#recBtn')) toggleRec();
    if (e.target.closest('#playMine') && mineUrl) new Audio(mineUrl).play();
  });
  $('sSpeak').addEventListener('click', () => speak(sPack.words[sIdx].en));
  $('sPrev').addEventListener('click', () => { if (sIdx > 0) { sIdx--; renderStudy(true); } });
  $('sNext').addEventListener('click', () => { if (sIdx < sPack.words.length - 1) { sIdx++; renderStudy(true); } else { stopRec(); renderHome(); show('home'); } });
  $('studyHome').addEventListener('click', () => { stopRec(); speechSynthesis.cancel && speechSynthesis.cancel(); renderHome(); show('home'); });
  let tx0 = 0;
  $('sbody').addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, { passive: true });
  $('sbody').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx0;
    if (Math.abs(dx) > 70) (dx < 0 ? $('sNext') : $('sPrev')).click();
  }, { passive: true });

  // ---- 발음 녹음·인식·크기 곡선
  let recOn = false, mediaRec = null, stream = null, mineUrl = null, envTimer = null, envData = [], recog = null;
  async function toggleRec() { recOn ? stopRec() : startRec(); }
  async function startRec() {
    const w = sPack.words[sIdx];
    const heard = $('heard');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      heard.innerHTML = '마이크는 <b>https 주소</b>(또는 Safari 탭)에서만 쓸 수 있어요.'; return;
    }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) { heard.textContent = '마이크 권한이 필요해요 (' + err.name + ')'; return; }
    recOn = true; $('recBtn').textContent = '⏹ 멈추기'; $('recBtn').classList.add('on');
    heard.textContent = '듣고 있어요… 또박또박 말해 보세요';
    // 크기 곡선
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC(); const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Uint8Array(an.fftSize); envData = [];
    envTimer = setInterval(() => { an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) { const d = (v - 128) / 128; sum += d * d; } envData.push(Math.sqrt(sum / buf.length)); }, 40);
    // 녹음
    if (window.MediaRecorder) {
      const chunks = []; mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => chunks.push(e.data);
      mediaRec.onstop = () => { if (mineUrl) URL.revokeObjectURL(mineUrl); mineUrl = URL.createObjectURL(new Blob(chunks, { type: mediaRec.mimeType })); $('recActs').style.display = ''; };
      mediaRec.start();
    }
    // 음성 인식
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      recog = new SR(); recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 3;
      recog.onresult = ev => {
        const alts = Array.from(ev.results[0]).map(a => a.transcript);
        const best = alts.map(a => [a, E.pronunciationScore(w.en, a)]).sort((a, b) => b[1] - a[1])[0];
        const pct = Math.round(best[1] * 100);
        const face = pct >= 90 ? '👍 아주 좋아요!' : pct >= 60 ? '🙂 비슷해요, 강세를 더 살려 보세요' : '🔁 다시 한 번! 🔊 원어를 듣고 따라 해요';
        heard.innerHTML = `들린 말: <b>${esc(best[0])}</b> · 일치 ${pct}% <div>${face}</div>`;
      };
      recog.onerror = ev => { heard.textContent = '인식 실패(' + ev.error + ') — 녹음은 저장됐어요. ▶ 내 녹음과 🔊 원어를 번갈아 들어 보세요'; };
      recog.onend = () => { if (recOn) stopRec(); };
      recog.start();
    } else {
      heard.textContent = '이 브라우저는 음성 인식이 없어요 — 녹음 후 ▶ 내 녹음과 🔊 원어를 비교해 보세요';
    }
    setTimeout(() => { if (recOn) stopRec(); }, 6000);
  }
  function stopRec() {
    if (!recOn) return;
    recOn = false; clearInterval(envTimer);
    try { recog && recog.stop(); } catch {}
    try { mediaRec && mediaRec.state !== 'inactive' && mediaRec.stop(); } catch {}
    stream && stream.getTracks().forEach(t => t.stop()); stream = null;
    const b = $('recBtn'); if (b) { b.textContent = '🎤 다시 녹음'; b.classList.remove('on'); }
    drawEnv();
  }
  function drawEnv() {
    const c = $('env'); if (!c || envData.length < 5) return;
    c.style.display = '';
    const ctx = c.getContext('2d'); const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    // 앞뒤 무음 제거
    const th = Math.max(...envData) * 0.12; let a = envData.findIndex(v => v > th); let z = envData.length - 1; while (z > a && envData[z] < th) z--;
    const d = envData.slice(Math.max(0, a - 2), z + 3); const mx = Math.max(...d) || 1;
    ctx.fillStyle = '#7c5cff';
    d.forEach((v, i) => { const x = i / d.length * W, h = v / mx * (H - 20); ctx.fillRect(x, H - 10 - h, Math.max(2, W / d.length - 1), h); });
    ctx.fillStyle = '#8b90a0'; ctx.font = '18px sans-serif'; ctx.fillText('소리 크기 — 높은 막대 = 세게 말한 부분. 강세 음절에서 높아야 해요', 8, 20);
  }

  // ---- 결과
  function fmt(ms) { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}분 ${s % 60}초`; }
  function finish() {
    clearInterval(timer);
    const sm = E.summary(session);
    $('elapsed').textContent = fmt(sm.elapsedMs);
    $('resultTitle').textContent = pack.title;
    $('roundsTbl').innerHTML = '<tr><th>단계</th><th>회차</th><th class="ok">O</th><th class="ng">X</th></tr>' +
      sm.rounds.map(r => `<tr><td>${phaseName(r.phase)}</td><td>${r.pass}</td><td class="ok">${r.ok}</td><td class="ng">${r.ng}</td></tr>`).join('');
    $('weakWrap').innerHTML = sm.weak.length
      ? `<div class="sub">많이 틀린 단어</div><table>${sm.weak.slice(0, 5).map(w => `<tr><td><b>${w.en}</b></td><td>${w.ko}</td><td class="ng">${w.misses}회</td></tr>`).join('')}</table>`
      : '<div class="sub">한 번도 안 틀렸어요! 👏</div>';
    const ss = load(LS.sessions, []);
    ss.push({ date: new Date().toISOString().slice(0, 10), title: pack.title, elapsedMs: sm.elapsedMs,
      totalNg: sm.rounds.reduce((a, r) => a + r.ng, 0), weak: sm.weak.slice(0, 10) });
    save(LS.sessions, ss.slice(-50));
    show('result');
  }
  $('again').addEventListener('click', () => start(pack));
  $('toHome').addEventListener('click', () => { renderHome(); show('home'); });

  renderHome();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
